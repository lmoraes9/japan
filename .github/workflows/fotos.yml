name: Baixar fotos dos mapas

# Roda sozinho quando o script ou as buscas mudam, e pode ser disparado à mão
# pelo app do GitHub (aba Actions → este workflow → Run workflow).
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebaixar todas as fotos (mesmo as que já existem)'
        type: boolean
        default: false
      only:
        description: 'Só um mapa (ex.: fushimi-inari) — vazio = todos'
        type: string
        default: ''
  push:
    # na main o push é o merge de uma branch onde este job já rodou;
    # rodar de novo só gera um segundo commit idêntico
    branches-ignore:
      - main
    paths:
      - 'scripts/fetch-place-photos.mjs'
      - 'scripts/optimize-photos.mjs'
      - 'scripts/photo-queries.json'
      - '.github/workflows/fotos.yml'

permissions:
  contents: write

concurrency:
  group: fotos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # se estourar o tempo, o que já baixou ainda é commitado no passo seguinte
      # e o próximo run continua de onde este parou
      - name: Baixar as fotos do Wikimedia Commons
        timeout-minutes: 42
        continue-on-error: true
        run: |
          node scripts/fetch-place-photos.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.only != '') && format('--only {0}', inputs.only) || '' }}

      - name: Recomprimir e gerar miniaturas
        if: always()
        run: node scripts/optimize-photos.mjs

      - name: Commitar o que mudou
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lugares src/data/placePhotos.generated.ts
          if git diff --cached --quiet; then
            echo 'Nada mudou — nenhuma foto nova.'
            exit 0
          fi
          git commit -m 'Fotos dos mapas de lugares (Wikimedia Commons, baixadas pelo CI)'
          # alguém pode ter pushado na branch enquanto as fotos baixavam:
          # rebaseia o commit das fotos por cima e tenta de novo, até 3 vezes
          for tentativa in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejeitado (tentativa $tentativa); rebaseando de novo…"
            sleep 5
          done
          exit 1

      - name: Resumo
        if: always()
        run: |
          echo '### Fotos baixadas' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          ls -la public/lugares/*/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo 'nenhuma' >> $GITHUB_STEP_SUMMARY
